# Guida TV italiana: epg (iptv-org) scarica i palinsesti, web li serve.
# Accesso predefinito: http://127.0.0.1:8085. Per LAN/Tailscale configura GUIDATV_BIND.
services:
  epg:
    build: ./epg
    restart: unless-stopped
    environment:
      TZ: Europe/Rome
      CRON_SCHEDULE: "0 4,14 * * *"   # due aggiornamenti al giorno (ora del container)
      RUN_AT_STARTUP: "true"
      DAYS: "3"
      MAX_CONNECTIONS: "3"
      DELAY: "100"
      TIMEOUT: "30000"
    volumes:
      - ./epg/channels.xml:/epg/public/channels.xml:ro
      # parser aggiornato: lo scraper upstream di superguidatv.it non funziona più
      - ./epg/superguidatv.it.config.js:/epg/sites/superguidatv.it/superguidatv.it.config.js:ro
    expose: ["3000"]

  web:
    build: ./server
    restart: unless-stopped
    depends_on: [epg]
    environment:
      TZ: Europe/Rome
      EPG_URL: http://epg:3000/guide.xml
      EPG_REFRESH_URL: http://epg:3000/refresh
      REFRESH_MIN: "20"
      STREAMS_M3U: ${GUIDATV_STREAMS_M3U:-/streams/official.m3u}
      RECORDINGS_BEFORE_MIN: ${RECORDINGS_BEFORE_MIN:-2}
      RECORDINGS_AFTER_MIN: ${RECORDINGS_AFTER_MIN:-10}
      RECORDINGS_MAX_CONCURRENT: ${RECORDINGS_MAX_CONCURRENT:-2}
      RECORDINGS_TV8: ${RECORDINGS_TV8:-0}
      RECORDINGS_RAI: ${RECORDINGS_RAI:-0}
      RECORDINGS_VSMETA: ${RECORDINGS_VSMETA:-0}
      RECORDINGS_SMB: ${GUIDATV_SMB_SHARE:-}
      RECORDINGS_SMB_IP: ${GUIDATV_SMB_IP:-}
      RECORDINGS_SMB_TAILSCALE_HOST: ${GUIDATV_SMB_TAILSCALE_HOST:-}
    volumes:
      - guidatv-data:/data   # ultima guida valida, usata se epg è giù
      - ./streams:/streams:ro
      - ${GUIDATV_SMB_DIR:-${HOME}/.config/guidatv}:/run/guidatv:ro
    ports:
      - "${GUIDATV_BIND-127.0.0.1}:${GUIDATV_PORT:-8085}:8080"

volumes:
  guidatv-data:
